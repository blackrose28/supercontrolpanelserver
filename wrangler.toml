name = "cc-server-worker"
main = "src/worker/index.ts"
compatibility_date = "2026-04-29"
pages_build_output_dir = "public/admin-next"

# Admin UI is built to public/admin-next and served by Workers
# This directory is auto-detected as the assets directory

# Bindings are introduced incrementally as migration phases land.
# Phase 2 will replace the placeholder database_id with the real D1 id.
[[d1_databases]]
binding = "CC_DB"
database_name = "cc-server"
database_id = "edf372f4-243f-47fc-9e20-c9bd2800fca5"

[durable_objects]
bindings = [
  { name = "CC_AGENT_DO", class_name = "AgentConnectionDurableObject" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["AgentConnectionDurableObject"]
